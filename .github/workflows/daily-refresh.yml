name: Discover, verify, and publish

on:
  schedule:
    # First-party scans every four hours. GitHub may delay scheduled starts, so
    # freshness is measured from the persisted run manifest, not cron time.
    - cron: "17 */4 * * *"
  workflow_dispatch:
  # NOTE: No push trigger. The action commits with GITHUB_TOKEN which
  # doesn't trigger workflows, but removing push trigger entirely
  # avoids any confusion. Use workflow_dispatch for manual runs.

permissions:
  contents: write

concurrency:
  group: bountyboard-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed DB from JSON
        run: python3 scripts/seed_db.py

      - name: Discover opportunities
        run: python3 scripts/scout.py

      - name: Triage personal eligibility
        run: |
          python3 scripts/validate_profile.py
          python3 scripts/triage_candidates.py

      - name: Evaluate discovery coverage
        id: discovery_gate
        continue-on-error: true
        run: python3 scripts/data_quality_gate.py

      - name: Validate successful-run receipt
        run: python3 scripts/check_freshness.py --max-age-hours 1

      - name: Check data quality
        run: python3 scripts/verify_data.py --check-urls

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate site
        run: python3 scripts/generate_site.py

      - name: Assert freshness metadata
        run: |
          grep -q 'id="freshnessStatus"' docs/index.html
          grep -q 'data-generated-at=' docs/index.html
          grep -q 'Last successful refresh' docs/index.html

      - name: Sync JSON from DB
        run: python3 scripts/sync_opportunities.py

      - name: Commit and push if changed
        run: |
          test -z "$(git status --porcelain -- docs/ data/opportunities.json data/scout_candidates.json data/source_health.json data/last_run.json)" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/opportunities.json data/scout_candidates.json data/source_health.json data/last_run.json
          git commit -m "Radar refresh: discover, verify, and regenerate"
          git push

      - name: Fail loudly on degraded discovery
        if: steps.discovery_gate.outcome == 'failure'
        run: |
          echo "Discovery results were published, but source coverage was degraded."
          exit 1
