name: Discover, verify, and publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # NOTE: No push trigger. The action commits with GITHUB_TOKEN which
  # doesn't trigger workflows, but removing push trigger entirely
  # avoids any confusion. Use workflow_dispatch for manual runs.

permissions:
  contents: write

concurrency:
  group: bountyboard-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed DB from JSON
        run: python3 scripts/seed_db.py

      - name: Discover opportunities
        run: python3 scripts/scout.py

      - name: Check data quality
        run: python3 scripts/verify_data.py --check-urls

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate site
        run: python3 scripts/generate_site.py

      - name: Sync JSON from DB
        run: |
          python3 -c "
          import db, json
          opps = db.get_all()
          fields = [
              'id','name','category','deadline','start_date','prize_usd','prize_note',
              'theme_fit','status','tracks','angle','url','resubmittable','notes',
              'submission_url','source','verification_status','verified_at',
              'last_checked_at','application_status','eligibility','award_type',
              'max_award_usd','win_probability'
          ]
          out = [{k: o[k] for k in fields if k in o} for o in opps]
          with open('data/opportunities.json', 'w') as f:
              json.dump(out, f, indent=2)
          "

      - name: Commit and push if changed
        run: |
          git diff --quiet docs/ data/opportunities.json data/scout_candidates.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/opportunities.json data/scout_candidates.json
          git commit -m "Radar refresh: discover, verify, and regenerate"
          git push
